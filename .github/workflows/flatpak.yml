name: Flatpak

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: python3 -m compileall -q gtasks
      - run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.rafatosta.gtasks.json
          bundle: gtasks.flatpak
          build-dir: build-dir
      - name: Verify installed GSettings schema
        run: >-
          flatpak build build-dir
          gsettings --schemadir /app/share/glib-2.0/schemas
          list-keys io.github.rafatosta.gtasks

      - name: Verify bundled Brazilian Portuguese translation
        run: |
          flatpak build build-dir python3 - <<'PY'
          import gettext
          from pathlib import Path

          catalog = Path('/app/share/locale/pt_BR/LC_MESSAGES/gtasks.mo')
          assert catalog.is_file(), 'Portuguese catalog is missing from the application bundle'
          assert not catalog.is_symlink(), 'Translations must be included in the standalone bundle'
          translation = gettext.translation('gtasks', '/app/share/locale', languages=['pt_BR'])
          assert translation.gettext('Save') == 'Salvar'
          PY
