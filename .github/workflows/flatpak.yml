name: Flatpak

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q gtasks
      - run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.rafatosta.gtasks.json
          bundle: gtasks.flatpak
          build-dir: build-dir
      - name: Verify installed GSettings schema
        run: >-
          flatpak-builder --run build-dir io.github.rafatosta.gtasks.json
          gsettings --schemadir /app/share/glib-2.0/schemas
          list-keys io.github.rafatosta.gtasks
